name: Write a post

on:
  schedule:
    # Mon, Wed, Fri, Sun around 9:45am Portland time (GitHub uses UTC).
    - cron: "47 16 * * 0,1,3,5"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (leave blank for random)"
        required: false
        type: choice
        default: ""
        options: ["", portland_events, portland_local, chicago_local, cats, clothing, wellness]

permissions:
  contents: write

concurrency:
  group: write-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Get fonts for the Instagram image
        run: |
          mkdir -p poster/fonts
          curl -sSfL -o poster/fonts/Fraunces.ttf "https://github.com/google/fonts/raw/main/ofl/fraunces/Fraunces%5BSOFT,WONK,opsz,wght%5D.ttf" || true
          curl -sSfL -o poster/fonts/Inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" || true

      - name: Write the post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_TOPIC: ${{ inputs.topic }}
        run: python poster/generate.py --no-notify

      - name: Save it to the page
        run: |
          git config user.name "post-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "New post"
          git pull --rebase
          git push

      - name: Wait for the page to update
        run: sleep 90

      - name: Ping your phone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python poster/generate.py --notify-only
